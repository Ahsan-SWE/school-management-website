[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "school-platform-timetable-optimizer"
version = "0.1.0"
description = "Constraint-based timetable optimiser service."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "ortools>=9.14,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
